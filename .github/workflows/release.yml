name: Release

# Publicação das imagens Docker (GHCR) e aplicação controlada de migrações.
#
# Execução manual: Actions > Release > Run workflow.
# - `publish-images` sempre roda: publica as imagens da API e do worker no GHCR
#   usando o `GITHUB_TOKEN` (não exige credenciais externas).
# - `migrate` só roda quando `run_migrations=true` e usa o environment
#   `production` — configure revisores obrigatórios nesse environment para que a
#   aprovação manual seja exigida antes de tocar o banco de produção
#   (especificação, seção 13.2: "não executar deploy de produção sem autorização
#   explícita").
#
# Push de tag `v*` também dispara a publicação das imagens.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag das imagens (padrão: tag do Git ou sha-<curto>)'
        required: false
        type: string
      run_migrations:
        description: 'Aplicar migrações no banco de produção (exige aprovação)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-images:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir prefixo e tag das imagens
        id: meta
        shell: bash
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              tag="${GITHUB_REF#refs/tags/}"
            else
              tag="sha-${GITHUB_SHA::7}"
            fi
          fi
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Imagens: $prefix/qualitytest-api:$tag e $prefix/qualitytest-worker:$tag"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/qualitytest-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/qualitytest-api:sha-${{ github.sha }}

      - name: Build e push do worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/qualitytest-worker:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/qualitytest-worker:sha-${{ github.sha }}

      - name: Resumo
        run: |
          {
            echo "## Imagens publicadas"
            echo ""
            echo "- \`${{ steps.meta.outputs.prefix }}/qualitytest-api:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.prefix }}/qualitytest-worker:${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "Digest imutável também publicado com a tag \`sha-${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Migrações (banco de produção)
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ inputs.run_migrations == true }}
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar segredo DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Segredo DATABASE_URL não configurado no environment 'production'."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrações pendentes
        run: npm run db:migrate:deploy
